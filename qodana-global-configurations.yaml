# Qodana Global Configurations
# This file defines global inspection profiles that can be shared across projects
# Upload to Qodana Cloud using the qodana-config-upload workflow
# Then reference in project .qodana.yaml with: global: true

version: "1.0"

# Global inspection profile for Java projects
inspections:
  - name: qodana.java.recommended
    description: "Recommended Java inspections for PagaTu project"
    enabled: true
    severity: WARNING
    scope:
      - "*.java"
    options:
      # Nullability
      ConstantConditions: WARNING
      NullableProblems: WARNING
      ContractViolation: WARNING
      
      # Code style
      UnusedDeclaration: WARNING
      UnusedImport: WARNING
      RedundantCast: WARNING
      RedundantTypeArguments: WARNING
      
      # Best practices
      EqualsBetweenInconvertibleTypes: WARNING
      ClassCanBeRecord: INFO
      LocalVariableCouldBeFinal: INFO
      MethodCanBeStatic: INFO
      
      # Concurrency
      SynchronizationOnLocalVariableOrParameter: WARNING
      ThreadSafety: WARNING
      
      # Performance
      BoxingUnboxing: INFO
      StringConcatenationInLoop: WARNING
      
      # Security
      HardCodedStringLiteral: INFO
      SerializableHasSerialVersionUIDField: INFO

  - name: qodana.kotlin.recommended
    description: "Recommended Kotlin inspections (if Kotlin added later)"
    enabled: false
    severity: WARNING
    scope:
      - "*.kt"

  - name: qodana.yaml.recommended
    description: "YAML configuration files validation"
    enabled: true
    severity: WARNING
    scope:
      - "*.yaml"
      - "*.yml"
    options:
      YamlKeyDuplicates: ERROR
      YamlInvalidKey: ERROR
      YamlFileStructure: WARNING

  - name: qodana.docker.recommended
    description: "Dockerfile best practices"
    enabled: true
    severity: WARNING
    scope:
      - "Dockerfile*"
    options:
      DockerfileLatestTag: WARNING
      DockerfileNoPin: WARNING
      DockerfileRootUser: WARNING

  - name: qodana.shell.recommended
    description: "Shell script best practices"
    enabled: true
    severity: WARNING
    scope:
      - "*.sh"
    options:
      ShellCheck: WARNING

# Exclude patterns applied globally
exclude:
  - "**/target/**"
  - "**/.mvn/**"
  - "**/mvnw*"
  - "**/.git/**"
  - "**/*.class"
  - "**/*.jar"
  - "**/RELEASE-README.md"
  - "**/test/**"
  - "**/*Test.java"
  - "**/*IT.java"

# Baseline for known issues (optional, create after first run)
# baseline: .qodana.baseline.json