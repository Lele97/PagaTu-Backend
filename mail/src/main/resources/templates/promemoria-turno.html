<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <meta charset="UTF-8">
    <title>Promemoria: è il tuo turno di pagare la colazione!</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333; margin: 0; padding: 0; background-color: #f8f9fa;">
<div style="width: 100%; background-color: #f8f9fa; padding: 20px 0;">
    <div style="max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1); overflow: hidden;">

        <div style="background: linear-gradient(135deg, #643718 0%, #A0522D 100%); color: #ffffff; text-align: center; padding: 30px 20px;">
            <h1 style="margin: 0; font-size: 24px; font-weight: normal;">Promemoria colazione</h1>
        </div>

        <div style="padding: 40px 30px;">
            <p style="font-size: 16px;">Ciao <strong th:text="${username}">Nome Utente</strong>,</p>
            <p style="font-size: 16px;">
                Ti ricordiamo che è il tuo turno di pagare la colazione nel gruppo
                <strong th:text="${groupName}">Gruppo</strong>
                da <strong th:text="${hoursPending}">24</strong> ore.
            </p>
            <p style="font-size: 16px;">Accedi a PagaTu per registrare il pagamento o saltare il turno.</p>
        </div>

        <div style="background-color: #f8f9fa; text-align: center; padding: 20px; font-size: 12px; color: #6c757d;">
            <p style="margin: 0;">PagaTu — chi paga la colazione oggi?</p>
        </div>
    </div>
</div>
</body>
</html>
