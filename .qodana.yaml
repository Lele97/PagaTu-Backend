# Qodana Configuration for PagaTu
# https://www.jetbrains.com/help/qodana/qodana-yaml.html

version: "1.0"

# Use Java community linter (free)
linter: qodana-java-community

# Use global configurations from Qodana Cloud
# Requires: qodana-global-configurations.yaml uploaded via qodana-config-upload workflow
global: true

# Run on the whole project
root: .

# Include/exclude patterns
include:
  - "**/*.java"
  - "**/*.xml"
  - "**/*.yml"
  - "**/*.yaml"
  - "**/*.sh"
  - "**/Dockerfile*"
  - "**/Makefile*"

exclude:
  - "**/target/**"
  - "**/.mvn/**"
  - "**/mvnw*"
  - "**/.git/**"
  - "**/*.class"
  - "**/*.jar"
  - "**/RELEASE-README.md"
  - "**/test/**"
  - "**/*Test.java"
  - "**/*IT.java"

# Profile settings - extends global qodana.java.recommended
profile:
  name: qodana.java.recommended
  # Project-specific overrides
  include:
    # Stricter for production code
    UnusedDeclaration: WARNING
    ConstantConditions: WARNING
    NullableProblems: WARNING

# Java-specific settings
java:
  jdk: "17"
  buildTool: maven
  skipTests: true

# Timeout settings
timeout: 30m

# Resource limits
resources:
  memory: "4g"
  cpu: "2"

# Fail threshold (optional - uncomment to fail build on issues)
# failThreshold: 10