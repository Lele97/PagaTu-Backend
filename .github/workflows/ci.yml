# PagaTu CI/CD Workflow
# Simple, clean CI/CD that runs locally with `act`
# - CI: Runs on every push/PR to develop and main
# - CD: Creates release on push to main (after version tag)

name: PagaTu CI/CD

on:
  push:
    branches:
      - develop
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '*.md'
  pull_request:
    branches:
      - develop
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:  # Allow manual trigger

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'
  MAVEN_OPTS: '-Dmaven.repo.local=.m2/repository'

jobs:
  # ==========================================
  # CI: Build & Test all services in parallel
  # ==========================================
  build-and-test:
    runs-on: ubuntu-latest
    # Services needed for integration tests
    services:
      # NATS for messaging (auth, coffee, mail)
      nats:
        image: nats:latest
        ports:
          - 4222:4222
          - 8222:8222
        options: >-
          --health-cmd "nats-server --healthz"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # PostgreSQL for database (auth, coffee)
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Mailpit for email testing (mail service)
      mailpit:
        image: axllent/mailpit
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8025"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        service: [auth, coffee, mail, gateway-service, eureka-server]
        include:
          - service: auth
            db_name: auth
            spring_profiles: test
          - service: coffee
            db_name: coffee
            spring_profiles: test
          - service: mail
            db_name: ""
            spring_profiles: test
          - service: gateway-service
            db_name: ""
            spring_profiles: test
          - service: eureka-server
            db_name: ""
            spring_profiles: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for version script to access git history

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven
          cache-dependency-path: |
            **/pom.xml

      - name: Make scripts executable
        run: |
          chmod +x script/version.sh
          chmod +x mvnw

      - name: Show current version
        run: |
          echo "📦 Current version: $(./script/version.sh show)"
          echo "🚀 Next version: $(./script/version.sh next)"
          echo "🌿 Release branch: $(./script/version.sh branch)"

      - name: Initialize PostgreSQL databases
        if: matrix.db_name != ''
        run: |
          # Wait for postgres to be ready
          until pg_isready -h localhost -p 5432 -U postgres; do sleep 2; done
          # Create database for this service
          psql -h localhost -p 5432 -U postgres -c "CREATE DATABASE ${{ matrix.db_name }};"
        env:
          PGPASSWORD: postgres

      - name: Build and Test ${{ matrix.service }}
        run: |
          ./mvnw -B -pl ${{ matrix.service }} -am clean verify
        env:
          SPRING_PROFILES_ACTIVE: ${{ matrix.spring_profiles }}
          NATS_SERVER: nats://localhost:4222
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/${{ matrix.db_name }}
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          SPRING_MAIL_HOST: localhost
          SPRING_MAIL_PORT: 1025
          SPRING_MAIL_USERNAME: noreply@pagatu.local
          SPRING_MAIL_PASSWORD: pagatu
          JWT_SECRET: test-secret-key-for-ci-testing-only-32chars
          EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://localhost:8761/eureka/

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.service }}
          path: ${{ matrix.service }}/target/surefire-reports/
          retention-days: 7

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: ${{ matrix.service }}/target/site/jacoco/
          retention-days: 7

  # ==========================================
  # CI: Qodana Code Quality Analysis (optional)
  # Runs in parallel with build-and-test
  # ==========================================
  qodana:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
      security-events: write
    continue-on-error: true  # Don't block release if Qodana fails (e.g., no token)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven
          cache-dependency-path: |
            **/pom.xml

      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2026.1
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        with:
          pr-mode: ${{ github.event_name == 'pull_request' }}
          use-caches: true
          post-pr-comment: true
          use-annotations: true
          upload-result: true
          push-fixes: 'none'
          args: --show-report

      - name: Upload Qodana SARIF results
        if: always() && success() && hashFiles('qodana.sarif.json') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: qodana.sarif.json
          category: qodana

      - name: Upload Qodana HTML report
        if: always() && hashFiles('.qodana/report/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: qodana-report
          path: .qodana/report/
          retention-days: 14

  # ==========================================
  # CD: Create Release (only on main branch)
  # ==========================================
  create-release:
    needs: build-and-test  # Don't wait for qodana (optional)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Make scripts executable
        run: |
          chmod +x script/version.sh
          chmod +x mvnw

      - name: Calculate release version
        id: version
        run: |
          NEXT_VERSION=$(./script/version.sh next)
          BRANCH_NAME=$(./script/version.sh branch)
          echo "version=$NEXT_VERSION" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "🚀 Preparing release: $NEXT_VERSION"

      - name: Update parent pom.xml version
        run: |
          ./mvnw versions:set -DnewVersion=${{ steps.version.outputs.version }} -DgenerateBackupPoms=false
          echo "✅ Updated all pom.xml files to ${{ steps.version.outputs.version }}"

      - name: Create release branch
        run: |
          git checkout -b ${{ steps.version.outputs.branch }}
          git add pom.xml */pom.xml
          git commit -m "chore(release): prepare release ${{ steps.version.outputs.version }}"
          echo "✅ Created release branch: ${{ steps.version.outputs.branch }}"

      - name: Push release branch
        run: |
          git push origin ${{ steps.version.outputs.branch }}
          echo "✅ Pushed release branch"

      - name: Create Git tag
        run: |
          git tag -a "pagatu-v${{ steps.version.outputs.version }}" -m "Release ${{ steps.version.outputs.version }}"
          git push origin "pagatu-v${{ steps.version.outputs.version }}"
          echo "✅ Created tag: pagatu-v${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pagatu-v${{ steps.version.outputs.version }}
          name: PagaTu ${{ steps.version.outputs.version }}
          body: |
            ## Release ${{ steps.version.outputs.version }}
            
            ### Changes
            Automated release from develop branch.
            
            ### Services
            - auth
            - coffee
            - mail
            - gateway-service
            - eureka-server
            
            ### Docker Images
            Docker images will be available at: `ghcr.io/${{ github.repository }}/<service>:${{ steps.version.outputs.version }}`
          draft: false
          prerelease: false

  # ==========================================
  # Optional: Sync to GitLab (manual trigger)
  # ==========================================
  sync-to-gitlab:
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync to GitLab
        uses: keninkujovic/gitlab-sync@2.0.0
        with:
          gitlab_url: ${{ secrets.GIT_LAB_URI }}
          username: ${{ secrets.GIT_LAB_USERNAME }}
          gitlab_pat: ${{ secrets.GIT_LAB_TOKEN }}
        env:
          GITLAB_TOKEN: ${{ secrets.GIT_LAB_TOKEN }}