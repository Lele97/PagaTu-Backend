# PagaTu Release Workflow
# Triggers on push: Compile → Qodana Quality Gate → Release + README → Sync GitLab

name: PagaTu Release 

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'
  MAVEN_OPTS: '-Dmaven.repo.local=.m2/repository'

jobs:
  # ==========================================
  # CI: Compile all services (no tests, no services)
  # ==========================================
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ auth, coffee, mail, gateway-service, eureka-server ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven
          cache-dependency-path: |
            **/pom.xml

      - name: Make scripts executable
        run: |
          chmod +x script/version.sh
          chmod +x mvnw

      - name: Show current version
        run: |
          echo "📦 Current version: $(./script/version.sh show)"
          echo "🚀 Next version: $(./script/version.sh next)"
          echo "🌿 Release branch: $(./script/version.sh branch)"

      - name: Compile ${{ matrix.service }}
        run: |
          ./mvnw -B -pl ${{ matrix.service }} -am clean compile
        env:
          SKIP_TESTS: "true"

  # ==========================================
  # CI: Qodana Quality Gate (non-blocking until token fixed)
  # ==========================================
  qodana:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
      security-events: write
    continue-on-error: true
    outputs:
      status: ${{ steps.qodana-badge.outputs.qodana_status }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven
          cache-dependency-path: |
            **/pom.xml

      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2026.1
        with:
          pr-mode: false
          use-caches: true
          post-pr-comment: false
          use-annotations: true
          upload-result: true
          args: --linter qodana-java-community --config .qodana.yaml
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}

      - name: Qodana Badge (Quality Gate Status)
        if: always()
        run: |
          echo "qodana_status=${{ job.status }}" >> $GITHUB_OUTPUT
        id: qodana-badge

  # ==========================================
  # CD: Create Release (only on main)
  # ==========================================
  create-release:
    needs: [compile, qodana]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      branch: ${{ steps.version.outputs.branch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Make scripts executable
        run: |
          chmod +x script/version.sh
          chmod +x mvnw

      - name: Calculate release version
        id: version
        run: |
          NEXT_VERSION=$(./script/version.sh next)
          BRANCH_NAME=$(./script/version.sh branch)
          echo "version=$NEXT_VERSION" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "🚀 Preparing release: $NEXT_VERSION"

      - name: Update parent pom.xml version
        run: |
          ./mvnw versions:set -DnewVersion=${{ steps.version.outputs.version }} -DgenerateBackupPoms=false
          echo "✅ Updated all pom.xml files to ${{ steps.version.outputs.version }}"

      - name: Create release branch
        run: |
          git checkout -b ${{ steps.version.outputs.branch }}
          git add pom.xml */pom.xml
          git commit -m "chore(release): prepare release ${{ steps.version.outputs.version }}"
          echo "✅ Created release branch: ${{ steps.version.outputs.branch }}"

      - name: Push release branch
        run: |
          git push origin ${{ steps.version.outputs.branch }}
          echo "✅ Pushed release branch"

      - name: Create Git tag
        run: |
          git tag -a "pagatu-v${{ steps.version.outputs.version }}" -m "Release ${{ steps.version.outputs.version }}"
          git push origin "pagatu-v${{ steps.version.outputs.version }}"
          echo "✅ Created tag: pagatu-v${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pagatu-v${{ steps.version.outputs.version }}
          name: PagaTu ${{ steps.version.outputs.version }}
          body: |
            ## Release ${{ steps.version.outputs.version }}
            
            ### Services
            - auth
            - coffee
            - mail
            - gateway-service
            - eureka-server
          draft: false
          prerelease: false

  # ==========================================
  # CD: Create Release README.md (only on main)
  # ==========================================
  create-readme:
    needs: [create-release, qodana]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Make scripts executable
        run: chmod +x script/create-version-readme.sh

      - name: Generate Release README
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          BRANCH="${{ needs.create-release.outputs.branch }}"
          QODANA_STATUS="${{ needs.qodana.outputs.status }}"
          ./script/create-version-readme.sh "$VERSION" "$BRANCH" "$QODANA_STATUS" RELEASE-README.md

      - name: Commit README to release branch
        run: |
          git checkout ${{ needs.create-release.outputs.branch }}
          git add RELEASE-README.md
          git commit -m "docs(release): add release README for ${{ needs.create-release.outputs.version }}"
          git push origin ${{ needs.create-release.outputs.branch }}

      - name: Upload README as Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pagatu-v${{ needs.create-release.outputs.version }}
          files: RELEASE-README.md
          body_path: RELEASE-README.md

  # ==========================================
  # Sync to GitLab (on all pushes after CI passes)
  # ==========================================
  sync-to-gitlab:
    needs: [compile, qodana]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync to GitLab
        uses: keninkujovic/gitlab-sync@2.0.0
        with:
          gitlab_url: ${{ secrets.GIT_LAB_URI }}
          username: ${{ secrets.GIT_LAB_USERNAME }}
          gitlab_pat: ${{ secrets.GIT_LAB_TOKEN }}
        env:
          GITLAB_TOKEN: ${{ secrets.GIT_LAB_TOKEN }}