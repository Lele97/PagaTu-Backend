# PagaTu Release Workflow
# Triggers on push to main: Build → Qodana Quality Gate → Release + README

name: PagaTu Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '*.md'

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'
  MAVEN_OPTS: '-Dmaven.repo.local=.m2/repository'

jobs:
  # ==========================================
  # CI: Build & Test all services in parallel
  # ==========================================
  build-and-test:
    runs-on: ubuntu-latest
    services:
      nats:
        image: nats:2.15.0
        command: [ "-m", "8222" ]
        ports:
          - 4222:4222
          - 8222:8222
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8222/healthz"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mailpit:
        image: axllent/mailpit
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8025"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        service: [ auth, coffee, mail, gateway-service, eureka-server ]
        include:
          - service: auth
            db_name: auth
            spring_profiles: test
          - service: coffee
            db_name: coffee
            spring_profiles: test
          - service: mail
            db_name: ""
            spring_profiles: test
          - service: gateway-service
            db_name: ""
            spring_profiles: test
          - service: eureka-server
            db_name: ""
            spring_profiles: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven
          cache-dependency-path: |
            **/pom.xml

      - name: Make scripts executable
        run: |
          chmod +x script/version.sh
          chmod +x mvnw

      - name: Show current version
        run: |
          echo "📦 Current version: $(./script/version.sh show)"
          echo "🚀 Next version: $(./script/version.sh next)"
          echo "🌿 Release branch: $(./script/version.sh branch)"

      - name: Initialize PostgreSQL databases
        if: matrix.db_name != ''
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do sleep 2; done
          psql -h localhost -p 5432 -U postgres -c "CREATE DATABASE ${{ matrix.db_name }};"
        env:
          PGPASSWORD: postgres

      - name: Build and Test ${{ matrix.service }}
        run: |
          ./mvnw -B -pl ${{ matrix.service }} -am clean verify
        env:
          SPRING_PROFILES_ACTIVE: ${{ matrix.spring_profiles }}
          NATS_SERVER: nats://localhost:4222
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/${{ matrix.db_name }}
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          SPRING_MAIL_HOST: localhost
          SPRING_MAIL_PORT: 1025
          SPRING_MAIL_USERNAME: noreply@pagatu.local
          SPRING_MAIL_PASSWORD: pagatu
          JWT_SECRET: test-secret-key-for-ci-testing-only-32chars
          EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://localhost:8761/eureka/

  # ==========================================
  # CI: Qodana Quality Gate (BLOCKING)
  # Must pass for release to proceed
  # ==========================================
  qodana:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven
          cache-dependency-path: |
            **/pom.xml

      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2026.1
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        with:
          pr-mode: false
          use-caches: true
          post-pr-comment: false
          use-annotations: true
          upload-result: true
          push-fixes: 'none'

  # ==========================================
  # CD: Create Release (needs both CI jobs)
  # ==========================================
  create-release:
    needs: [build-and-test, qodana]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      branch: ${{ steps.version.outputs.branch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Make scripts executable
        run: |
          chmod +x script/version.sh
          chmod +x mvnw

      - name: Calculate release version
        id: version
        run: |
          NEXT_VERSION=$(./script/version.sh next)
          BRANCH_NAME=$(./script/version.sh branch)
          echo "version=$NEXT_VERSION" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "🚀 Preparing release: $NEXT_VERSION"

      - name: Update parent pom.xml version
        run: |
          ./mvnw versions:set -DnewVersion=${{ steps.version.outputs.version }} -DgenerateBackupPoms=false
          echo "✅ Updated all pom.xml files to ${{ steps.version.outputs.version }}"

      - name: Create release branch
        run: |
          git checkout -b ${{ steps.version.outputs.branch }}
          git add pom.xml */pom.xml
          git commit -m "chore(release): prepare release ${{ steps.version.outputs.version }}"
          echo "✅ Created release branch: ${{ steps.version.outputs.branch }}"

      - name: Push release branch
        run: |
          git push origin ${{ steps.version.outputs.branch }}
          echo "✅ Pushed release branch"

      - name: Create Git tag
        run: |
          git tag -a "pagatu-v${{ steps.version.outputs.version }}" -m "Release ${{ steps.version.outputs.version }}"
          git push origin "pagatu-v${{ steps.version.outputs.version }}"
          echo "✅ Created tag: pagatu-v${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pagatu-v${{ steps.version.outputs.version }}
          name: PagaTu ${{ steps.version.outputs.version }}
          body: |
            ## Release ${{ steps.version.outputs.version }}
            
            ### Services
            - auth
            - coffee
            - mail
            - gateway-service
            - eureka-server
          draft: false
          prerelease: false

  # ==========================================
  # CD: Create Release README.md
  # ==========================================
  create-readme:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Make scripts executable
        run: chmod +x script/create-version-readme.sh

      - name: Generate Release README
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          BRANCH="${{ needs.create-release.outputs.branch }}"
          ./script/create-version-readme.sh "$VERSION" "$BRANCH" RELEASE-README.md

      - name: Commit README to release branch
        run: |
          git checkout ${{ needs.create-release.outputs.branch }}
          git add RELEASE-README.md
          git commit -m "docs(release): add release README for ${{ needs.create-release.outputs.version }}"
          git push origin ${{ needs.create-release.outputs.branch }}

      - name: Upload README as Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pagatu-v${{ needs.create-release.outputs.version }}
          files: RELEASE-README.md
          body_path: RELEASE-README.md